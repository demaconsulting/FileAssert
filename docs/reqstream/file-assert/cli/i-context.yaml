---
# Software Unit Requirements for the IContext Interface
#
# IContext is the output contract interface for reporting assertion results and
# errors. It is implemented by Context and accepted by all asserters so that
# reporting logic is decoupled from the concrete Context implementation.

sections:
  - title: IContext Unit Requirements
    requirements:
      - id: FileAssert-IContext-OutputContract
        title: The IContext interface shall define an output contract for reporting informational messages and errors.
        justification: |
          All asserters and FileAssertFile accept IContext rather than the concrete Context
          class, decoupling their reporting logic from the specific output implementation
          (console, log file, or a future alternative).
        tests:
          - Context_WriteLine_NotSilent_WritesToConsole
          - Context_WriteError_SetsErrorExitCode
