---
# Spell-Checking with TextLint
#
# PURPOSE:
# - Maintain professional documentation and code quality
# - Catch spelling errors before publication
# - Support consistent technical terminology usage
# - Misspelled words should be fixed in the source
# - NEVER add a misspelled word to the 'words' list
# - PROPOSE only genuine technical terms/names as needed

version: '0.2'

language: en

# Files to spell-check (applied when TextLint is run without arguments)
files:
  - "**/*.{md,yaml,yml,json,cs,cpp,hpp,h,txt}"
# Include hidden paths such as .github/
enableGlobDot: true

# Project-specific technical terms and tool names
words:
  - appsettings
  - Dema
  - DEMA
  - demaconsulting
  - DEMACONSULTINGNUGETKEY
  - dogfooding
  - enation
  - filesystemglobbing
  - fontconfig
  - htmlagilitypack
  - ncipollo
  - nestings
  - netstandard
  - Pango
  - pdfpig
  - sarif
  - Sarif
  - SARIF
  - selftest
  - shopt
  - slnx
  - snupkg
  - sonarscanner
  - thirdparty
  - unidirectionality
  - venv
  - yamldotnet
  - yamlfix

# Exclude common build artifacts, dependencies, and vendored third-party code
ignorePaths:
  - '**/.git/**'
  - '**/node_modules/**'
  - '**/.venv/**'
  - '**/thirdparty/**'
  - '**/third-party/**'
  - '**/3rd-party/**'
  - '**/.agent-logs/**'
  - '**/bin/**'
  - '**/obj/**'
  - '**/generated/**'
  - package-lock.json
